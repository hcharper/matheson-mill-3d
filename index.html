renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ad, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-200, 400, 300);
scene.add(sun);

// centre the building on the origin; map x → x, map y → z (north is -z), up is y
const xs = DATA.units.flatMap(u => u.poly.map(p => p[0])), ys = DATA.units.flatMap(u => u.poly.map(p => p[1]));
const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
const floors = Math.max(...DATA.units.map(u => u.floor));

const greyMat = new THREE.MeshStandardMaterial({ color: GREY, roughness: 0.9, transparent: true });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x8a94a0, transparent: true, opacity: 0.55 });
const meshes = {}, pickable = [];
for (const u of DATA.units) {
  const shape = new THREE.Shape(u.poly.map(([x, y]) => new THREE.Vector2(x - cx, -(y - cy))));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: H * 0.94, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  const isAvail = u.plan !== undefined;
  const mat = isAvail ? new THREE.MeshStandardMaterial({ color: u.now ? NOW : LATER, roughness: 0.6 }) : greyMat;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = (u.floor - 1) * H;
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
  mesh.userData = u;
  scene.add(mesh);
  meshes[u.unit] = mesh;
  if (isAvail) pickable.push(mesh);
}
// the real footprint (outer wall, courtyards cut out) fills corridors, lobby and amenity space
const toV = r => r.map(([x, y]) => new THREE.Vector2(x - cx, -(y - cy)));
const coreShape = new THREE.Shape(toV(DATA.footprint[0]));
DATA.footprint.slice(1).forEach(r => coreShape.holes.push(new THREE.Path(toV(r))));
const coreGeo = new THREE.ExtrudeGeometry(coreShape, { depth: floors * H - H * 0.06 - 0.15, bevelEnabled: false });
coreGeo.rotateX(-Math.PI / 2);
// pushed back in depth so unit walls win where they sit on the outline
const coreMat = new THREE.MeshStandardMaterial({ color: GREY, roughness: 0.9, transparent: true,
  polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
const core = new THREE.Mesh(coreGeo, coreMat);
core.userData = {};
scene.add(core);
meshes.core = core;

const ground = new THREE.Mesh(new THREE.CircleGeometry(span * 0.9, 64), new THREE.MeshStandardMaterial({ color: 0xe2e6ea }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.3;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(40, 1, 1, span * 20);
camera.position.set(span * 1.0, span * 0.95, span * 1.3);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, floors * H / 2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.addEventListener('start', () => { controls.autoRotate = false; $('spin').checked = false; });
$('spin').onchange = e => controls.autoRotate = e.target.checked;
$('xray').onchange = e => { greyMat.opacity = e.target.checked ? 0.12 : 1; greyMat.depthWrite = !e.target.checked; coreMat.opacity = e.target.checked ? 0.08 : 1; coreMat.depthWrite = !e.target.checked; edgeMat.opacity = e.target.checked ? 0.18 : 0.55; };

// Google's photorealistic 3D tiles around the building. Loaded the first time the box is ticked,
// because every load starts a billed session; after that the box only shows and hides them.
const GEO = DATA.geo;
let tiles = null, sat = null, plinth = null;
// Google's mesh has the real building in it, a little taller than the model, so it would hide the
// units. This paints the footprint (grown a few feet, courtyards left open) into a mask, and the
// tiles drop every fragment that falls inside it.
function cutOut() {
  const pad = 4, size = 1024, pts = DATA.footprint[0];
  const x0 = Math.min(...pts.map(p => p[0])) - 2 * pad, y0 = Math.min(...pts.map(p => p[1])) - 2 * pad;
  const w = Math.max(...pts.map(p => p[0])) + 2 * pad - x0, h = Math.max(...pts.map(p => p[1])) + 2 * pad - y0;
  const cv = Object.assign(document.createElement('canvas'), { width: size, height: size }), g = cv.getContext('2d');
  g.setTransform(size / w, 0, 0, size / h, -x0 * size / w, -y0 * size / h);
  g.fillStyle = '#000'; g.fillRect(x0, y0, w, h);
  g.lineWidth = 2 * pad; g.lineJoin = 'round'; g.strokeStyle = '#fff';
  DATA.footprint.forEach((ring, i) => {
    g.beginPath(); ring.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
    g.fillStyle = i ? '#000' : '#fff'; g.fill(); g.stroke();
  });
  const map = new THREE.CanvasTexture(cv);
  map.flipY = false;
  const uniforms = { cutMap: { value: map }, cutBox: { value: new THREE.Vector4(x0 - cx, y0 - cy, w, h) } };
  return material => {
    material.customProgramCacheKey = () => 'cut';
    material.onBeforeCompile = shader => {
      Object.assign(shader.uniforms, uniforms);
      shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\nvarying vec2 vCut;')
        .replace('#include <project_vertex>', '#include <project_vertex>\nvCut = (modelMatrix * vec4(transformed, 1.0)).xz;');
      shader.fragmentShader = shader.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec2 vCut; uniform sampler2D cutMap; uniform vec4 cutBox;')
        .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
          vec2 cutUv = (vCut - cutBox.xy) / cutBox.zw;
          if (cutUv.x > 0.0 && cutUv.x < 1.0 && cutUv.y > 0.0 && cutUv.y < 1.0 && texture2D(cutMap, cutUv).r > 0.5) discard;`);
    };
  };
}
async function loadSat() {
  const [{ TilesRenderer }, { GoogleCloudAuthPlugin, ReorientationPlugin, GLTFExtensionsPlugin }, { DRACOLoader }] =
    await Promise.all([import('3d-tiles-renderer'), import('3d-tiles-renderer/plugins'), import('three/addons/loaders/DRACOLoader.js')]);
  tiles = new TilesRenderer();
  tiles.registerPlugin(new GoogleCloudAuthPlugin({ apiToken: GEO.key, autoRefreshToken: true }));
  tiles.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader: new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/') }));
  // puts the map's anchor point at the origin, up along y, with x west and z north
  tiles.registerPlugin(new ReorientationPlugin({ lat: GEO.lat * Math.PI / 180, lon: GEO.lon * Math.PI / 180, height: GEO.ground_m }));
  tiles.addEventListener('load-error', () => { if (!tiles.root) $('credit').textContent = 'Satellite view is unavailable right now'; });
  const cut = cutOut();
  tiles.addEventListener('load-model', ({ scene: model }) => model.traverse(o => o.material && cut(o.material)));
  tiles.setCamera(camera);
  // turn north to where it points on the map, scale metres to the model's feet, and move the anchor to the middle of the drawing
  sat = new THREE.Group();
  sat.rotation.y = Math.PI + GEO.bearing * Math.PI / 180;
  sat.scale.setScalar(GEO.ft_per_m);
  sat.position.set(GEO.x - cx, 0, GEO.y - cy);
  sat.add(tiles.group);
  scene.add(sat);
  // the site slopes, so carry the walls a little way down into the hole left in the ground
  const drop = 15, plinthGeo = new THREE.ExtrudeGeometry(coreShape, { depth: drop, bevelEnabled: false });
  plinthGeo.rotateX(-Math.PI / 2);
  plinth = new THREE.Mesh(plinthGeo, new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 1 }));
  plinth.position.y = -drop - 0.05;
  scene.add(plinth);
  setInterval(() => {
    if (!sat.visible || !tiles.root) return;
    $('credit').replaceChildren(...tiles.getAttributions().map(a => a.type === 'image'
      ? Object.assign(new Image(), { src: a.value, alt: 'Google' }) : Object.assign(document.createElement('span'), { textContent: a.value })));
  }, 1000);
}
if (GEO) {
  $('satbox').hidden = false;
  $('sat').onchange = async e => {
    const on = e.target.checked;
    ground.visible = !on;
    $('credit').style.display = on ? 'flex' : 'none';
    $('stage').classList.toggle('sat', on);
    if (on && !tiles) await loadSat();
    sat.visible = plinth.visible = $('sat').checked;
  };
}

let selected = null;
const baseColor = u => u.now ? NOW : LATER;
function select(unit) {
  if (selected) meshes[selected].material.color.setHex(baseColor(meshes[selected].userData));
  selected = unit;
  document.querySelectorAll('#list button').forEach(b => b.classList.toggle('on', b.dataset.unit === unit));
  if (!unit) return;
  const u = meshes[unit].userData;
  meshes[unit].material.color.setHex(PICK);
  $('detail').innerHTML = `<h2>Unit ${u.unit}</h2>
    <div class="rent">${money(u.rent)}/mo <span class="dim" style="font-weight:400">· ${money(u.total)} with fees</span></div>
    <div>${u.plan} · ${u.beds} bed / ${u.baths} bath · ${u.sqft ?? '—'} sq ft</div>
    <div class="dim">Floor ${u.floor} · ${u.now ? 'Available now' : 'Available ' + when(u)}</div>`;
}
for (const u of avail) {
  const b = document.createElement('button');
  b.dataset.unit = u.unit;
  b.innerHTML = `<b>${u.unit}</b><span>${u.plan}</span><span>${money(u.rent)}</span><span class="when">${when(u)}</span>`;
  b.onclick = () => { select(u.unit); $('xray').checked || $('xray').click(); };
  $('list').append(b);
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function hit(e) {
  const r = canvas.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  // the nearest thing under the pointer, so a grey unit in front blocks a green one behind it
  const first = ray.intersectObjects(Object.values(meshes), false)[0];
  const solid = greyMat.opacity === 1;
  if (!first) return null;
  if (first.object.userData.plan !== undefined) return first.object;
  return solid ? null : ray.intersectObjects(pickable, false)[0]?.object ?? null;
}
canvas.addEventListener('pointermove', e => {
  const m = hit(e), tip = $('tip');
  canvas.style.cursor = m ? 'pointer' : '';
  tip.style.display = m ? 'block' : 'none';
  if (m) {
    const u = m.userData, r = canvas.getBoundingClientRect();
    tip.textContent = `${u.unit} · ${u.plan} · ${money(u.rent)} · ${when(u)}`;
    tip.style.left = e.clientX - r.left + 'px';
    tip.style.top = e.clientY - r.top + 'px';
  }
});
let down = null;
canvas.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;  // a drag, not a click
  const m = hit(e);
  if (m) select(m.userData.unit);
});

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => {
  controls.update();
  if (sat?.visible) { camera.updateMatrixWorld(); tiles.setResolutionFromRenderer(camera, renderer); tiles.update(); }
  renderer.render(scene, camera);
});
window.__ready = true;
</script>
</body>
</html>
